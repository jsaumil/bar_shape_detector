# Production: docker compose up -d --build
# Only the frontend is published; it forwards /api/* to the backend on the internal network.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8001
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    volumes:
      - jobs:/app/jobs
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8001
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    depends_on:
      - backend

volumes:
  jobs:
